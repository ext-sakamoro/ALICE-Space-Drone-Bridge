name: CI

on:
  push:
    branches: [main, 'ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Preflight (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ALICE-Space-Drone-Bridge
    env:
      # the passed-test count at the commit that set it; fewer passed tests (a removed or skipped test,
      # or none at all) is a failure
      MIN_PASSED: "50"
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-Space-Drone-Bridge
          persist-credentials: false
      - name: Clone the siblings at the commits .github/alice-siblings pins
        run: |
          n=0
          while read -r repo sha; do
            case "$repo" in ''|'#'*) continue ;; esac
            git init -q "../$repo"
            git -C "../$repo" fetch -q --depth 1 "https://github.com/ext-sakamoro/$repo" "$sha"
            git -C "../$repo" checkout -q FETCH_HEAD
            n=$((n + 1))
          done < .github/alice-siblings
          if [ "$n" -eq 0 ]; then echo "::error::no sibling cloned"; exit 1; fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Every local gate (scripts/preflight.sh, full)
        run: bash scripts/preflight.sh
      - name: Passed tests are at least MIN_PASSED
        run: |
          set -o pipefail
          log="$(mktemp)"
          cargo test --workspace 2>&1 | tee "$log"
          passed=$(grep -E '^test result: ' "$log" | awk '{s += $4} END {print s + 0}')
          echo "passed: ${passed} (minimum ${MIN_PASSED})"
          if [ "${passed}" -lt "${MIN_PASSED}" ]; then
            echo "::error::${passed} tests passed, fewer than ${MIN_PASSED}"
            exit 1
          fi
